- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Assert unattended-upgrades is installed
  ansible.builtin.assert:
    that: "'unattended-upgrades' in ansible_facts.packages"
    fail_msg: unattended-upgrades is not installed
    quiet: true

- name: Read the effective apt configuration
  ansible.builtin.command: apt-config dump
  register: common_apt_config
  changed_when: false

- name: Assert apt refreshes and upgrades daily
  ansible.builtin.assert:
    that:
      - common_apt_periodic_update in common_apt_config.stdout_lines
      - common_apt_periodic_upgrade in common_apt_config.stdout_lines
    fail_msg: APT::Periodic settings are missing; unattended-upgrades will never run
    quiet: true
  vars:
    common_apt_periodic_update: 'APT::Periodic::Update-Package-Lists "1";'
    common_apt_periodic_upgrade: 'APT::Periodic::Unattended-Upgrade "1";'

- name: Assert update sources match exactly
  ansible.builtin.assert:
    that: common_actual_origins | sort == common_unattended_origins_patterns | sort
    fail_msg: >-
      apt allows {{ common_actual_origins }} but common_unattended_origins_patterns
      is {{ common_unattended_origins_patterns }}
    quiet: true
  vars:
    common_actual_origins: >-
      {{ common_apt_config.stdout_lines
         | select('match', '^Unattended-Upgrade::Origins-Pattern:: ')
         | map('regex_replace', '^Unattended-Upgrade::Origins-Pattern:: "(.*)";$', '\1')
         | list }}

- name: Assert reboot and cleanup settings
  ansible.builtin.assert:
    that:
      - (common_reboot_line in common_apt_config.stdout_lines) == (common_unattended_automatic_reboot | bool)
      - (common_deps_line in common_apt_config.stdout_lines) == (common_unattended_remove_unused_dependencies | bool)
      - (common_kernels_line in common_apt_config.stdout_lines) == (common_unattended_remove_unused_kernel_packages | bool)
    fail_msg: Automatic-Reboot or Remove-Unused-* doesn't match the common_unattended_* settings
    quiet: true
  vars:
    common_reboot_line: 'Unattended-Upgrade::Automatic-Reboot "true";'
    common_deps_line: 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'
    common_kernels_line: 'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'

# With only a name, systemd_service reports the unit's status and changes nothing.
- name: Read apt timer states
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: common_apt_timers
  loop: [apt-daily.timer, apt-daily-upgrade.timer]

- name: Assert apt timers are enabled and running
  ansible.builtin.assert:
    that:
      - item.status.UnitFileState == 'enabled'
      - item.status.ActiveState == 'active'
    fail_msg: >-
      {{ item.item }} is {{ item.status.UnitFileState }} / {{ item.status.ActiveState }};
      apt won't refresh or upgrade on schedule
    quiet: true
  loop: "{{ common_apt_timers.results }}"
  loop_control:
    label: "{{ item.item }}"
